name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: >
          ./gradlew
          testDebugUnitTest
          :oboe-engine:assembleRelease
          :oboe-media3:assembleRelease
          :sample:assembleDebug
